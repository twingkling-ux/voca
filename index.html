<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voca Dash - 영어 단어 게임</title>
    <!-- Tailwind CSS (스타일) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel (실행 엔진) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons (아이콘) -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // 게임 컴포넌트
        const GameApp = () => {
            const [gameState, setGameState] = useState('READY'); // READY, PLAYING, RESULT
            const [vocabData, setVocabData] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [options, setOptions] = useState([]);
            const [showHint, setShowHint] = useState(false);
            const [wrongWords, setWrongWords] = useState([]);
            const [timeLeft, setTimeLeft] = useState(100);

            // 1. 구글 시트 데이터 가져오기 (본인의 GAS URL로 교체하세요)
            const GAS_URL = "https://script.google.com/macros/s/AKfycbxyfSxRP-CURj5K4DF_OPlIZzE568grGfkwcyulU6O6InyjHOR5k1NI5q23Qawq4-ts2Q/exec";
              const speak = (text) => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            };

            const generateOptions = useCallback((currentWord) => {
                if (!currentWord) return;
                const correct = currentWord.word;
                const others = vocabData
                    .filter(v => v.word !== correct)
                    .sort(() => 0.5 - Math.random())
                    .slice(0, 3)
                    .map(v => v.word);
                setOptions([correct, ...others].sort(() => 0.5 - Math.random()));
            }, [vocabData]);

            useEffect(() => {
                if (gameState === 'PLAYING') {
                    generateOptions(vocabData[currentIndex]);
                    setShowHint(false);
                    setTimeLeft(100);
                }
            }, [currentIndex, gameState, generateOptions]);

            // 타이머 로직
            useEffect(() => {
                if (gameState !== 'PLAYING') return;
                const timer = setInterval(() => {
                    setTimeLeft((prev) => {
                        if (prev <= 0) {
                            handleAnswer(null);
                            return 100;
                        }
                        return prev - 1;
                    });
                }, 100);
                return () => clearInterval(timer);
            }, [gameState, currentIndex]);

            const handleAnswer = (selected) => {
                const currentWord = vocabData[currentIndex];
                if (selected === currentWord.word) {
                    speak(currentWord.word);
                    setScore(s => s + 10);
                    nextStep();
                } else {
                    setShowHint(true);
                    if (!wrongWords.find(w => w.word === currentWord.word)) {
                        setWrongWords([...wrongWords, currentWord]);
                    }
                }
            };

            const nextStep = () => {
                if (currentIndex < vocabData.length - 1) {
                    setCurrentIndex(currentIndex + 1);
                } else {
                    setGameState('RESULT');
                }
            };

            if (gameState === 'READY') {
                return (
                    <div className="flex flex-col items-center justify-center h-screen p-6 text-center">
                        <h1 className="text-4xl font-black text-blue-600 mb-4">VOCA DASH!</h1>
                        <p className="text-slate-600 mb-8">내려오는 단어를 보고 올바른 뜻을 고르세요.</p>
                        <button 
                            onClick={() => setGameState('PLAYING')}
                            className="bg-blue-600 text-white px-12 py-4 rounded-full text-xl font-bold shadow-lg"
                        >
                            게임 시작
                        </button>
                    </div>
                );
            }

            if (gameState === 'RESULT') {
                return (
                    <div className="flex flex-col items-center justify-center h-screen p-6">
                        <h2 className="text-3xl font-bold mb-4">학습 완료!</h2>
                        <div className="text-5xl font-black text-blue-600 mb-6">{score}점</div>
                        <div className="w-full max-w-sm bg-white rounded-xl p-4 shadow-md overflow-y-auto max-h-60 mb-6">
                            <h3 className="font-bold border-b pb-2 mb-2">복습할 단어</h3>
                            {wrongWords.map((w, i) => (
                                <div key={i} className="flex justify-between py-1 border-b text-sm">
                                    <span className="font-bold">{w.word}</span>
                                    <span>{w.meaning}</span>
                                </div>
                            ))}
                        </div>
                        <button onClick={() => window.location.reload()} className="bg-slate-800 text-white px-8 py-3 rounded-lg">다시 하기</button>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-screen max-w-md mx-auto bg-slate-50 p-6">
                    <div className="w-full bg-gray-200 h-3 rounded-full mb-8">
                        <div className="bg-blue-500 h-3 rounded-full transition-all duration-100" style={{ width: `${timeLeft}%` }} />
                    </div>
                    <div className="flex-1 flex flex-col items-center justify-center text-center">
                        <h1 className="text-5xl font-extrabold text-slate-800 mb-6">{vocabData[currentIndex]?.meaning}</h1>
                        <div className="h-12">
                            {showHint && <p className="text-yellow-600 font-bold bg-yellow-100 px-4 py-2 rounded-lg animate-bounce">힌트: {vocabData[currentIndex]?.initialSound}</p>}
                        </div>
                    </div>
                    <div className="grid grid-cols-2 gap-4 mt-8">
                        {options.map((opt, idx) => (
                            <button key={idx} onClick={() => handleAnswer(opt)} className="h-24 bg-white border-2 border-slate-200 rounded-2xl text-xl font-bold text-slate-700 active:bg-blue-100 shadow-sm transition-all">
                                {opt}
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<GameApp />);
    </script>
</body>
</html>
